[project]
name = "technical-books-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "cython>=3.3.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "memory-profiler>=0.61.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "sparklines>=1.0.0",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "black[jupyter]>=26.5.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[tool.black]
target-version = ["py312"]
line-length = 88
